name: Native Build Check & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix DNS and Apt Mirrors
        run: |
          sudo bash -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
          sudo bash -c 'echo "nameserver 1.1.1.1" >> /etc/resolv.conf'
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* || true
          sudo sed -i 's|http://security.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* || true
          for i in {1..5}; do sudo apt-get update --fix-missing && break || sleep 5; done
          for i in {1..5}; do sudo apt-get install -y --fix-missing libasound2-dev libudev-dev build-essential curl unzip && break || sleep 5; done

      - name: Setup Android NDK and Toolchain
        run: |
          ANDROID_NDK_VERSION="r26b"
          curl -LO https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          TOOLCHAIN=$PWD/android-ndk-${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
          echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android30-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android30-clang++" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android30-clang" >> $GITHUB_ENV

      - name: Setup Rust Toolchain with Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Android Shared Library (.so)
        run: |
          if [ -f "dragon_horizon/Cargo.toml" ]; then
            cd dragon_horizon && cargo build --release --target aarch64-linux-android
          elif [ -f "Cargo.toml" ]; then
            cargo build --release --target aarch64-linux-android
          else
            find . -name "Cargo.toml" -execdir cargo build --release --target aarch64-linux-android \;
          fi

      - name: Collect and Copy .so Artifact
        run: |
          mkdir -p output_so
          find . -name "*.so" -exec cp {} output_so/ \;
          ls -la output_so/

      - name: Upload Compiled Mod (.so)
        uses: actions/upload-artifact@v4
        with:
          name: dragon_horizon-android-arm64
          path: output_so/*.so
          if-no-files-found: error
